server:
  port: 8080

spring:
  application:
    name: ai-schedule
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai-schedule?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: ${DS_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Jackson 全局日期格式：LocalDateTime 统一输出 yyyy-MM-dd HH:mm:ss，
  # LocalDate 统一输出 yyyy-MM-dd，前端 el-table 直接渲染友好格式，无需额外格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  ai:
    openai:
      api-key: ${SILICONFLOW_API_KEY}
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: Qwen/Qwen3-8B
          temperature: 0.7
        completions-path: /v1/chat/completions
      #  禁用图片模型
      image:
        enabled: false




mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql
  # 分页合理化：页码越界时自动修正（小于1查首页，大于总页数查末页）
  reasonable: true
  support-methods-arguments: true

file:
  upload-dir: uploads/
  access-path: /upload/

jwt:
  # 签名密钥（生产环境请通过环境变量注入）
  secret: ${JWT_SECRET:ai-calendar-jwt-secret-key}
  # token过期时间（小时）
  expire-hours: 2