server:
  port: 8080

spring:
  application:
    name: ai-schedule
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai-schedule?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: ${DS_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Jackson 全局日期格式：LocalDateTime 统一输出 yyyy-MM-dd HH:mm:ss，
  # LocalDate 统一输出 yyyy-MM-dd，前端 el-table 直接渲染友好格式，无需额外格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  # Redis：存放双token的令牌状态（refresh白名单、access登出黑名单）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 本机Redis未设密码时保持注释，配置空串会导致AUTH认证失败
      # password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          # 单机模式下连接数需求低，够用即可，避免占用Redis连接
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 2000ms
  ai:
    openai:
      api-key: ${SILICONFLOW_API_KEY}
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: Qwen/Qwen3-8B
          temperature: 0.7
        completions-path: /v1/chat/completions
      #  禁用图片模型
      image:
        enabled: false




mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql
  # 分页合理化：页码越界时自动修正（小于1查首页，大于总页数查末页）
  reasonable: true
  support-methods-arguments: true

file:
  upload-dir: uploads/
  access-path: /upload/

jwt:
  # 访问令牌密钥（生产环境请通过环境变量注入）
  access-secret: ${JWT_ACCESS_SECRET:ai-calendar-access-secret-key}
  # 刷新令牌密钥：与访问令牌分离，避免一类令牌可被当作另一类使用
  refresh-secret: ${JWT_REFRESH_SECRET:ai-calendar-refresh-secret-key}
  # 访问令牌有效期（分钟）：短寿命，泄露窗口小
  access-expire-minutes: 30
  # 前台刷新令牌有效期（天）：长寿命，减少重新登录频率
  refresh-expire-days: 7
  # 后台管理刷新令牌有效期（小时）：管理端权限更高，有效期收紧
  admin-refresh-expire-hours: 12

# AI多轮记忆：Redis滑动窗口参数
ai:
  memory:
    # 保留轮数（1轮=一问一答，10轮即窗口最多20条）
    window-rounds: 10
    # 滑动过期（分钟）：每次读写重置，闲置超时后由DB冷启动回填
    ttl-minutes: 30
    # 单条内容最大字符数：超长截断，防止一条长回答把窗口挤爆
    max-content-length: 4000